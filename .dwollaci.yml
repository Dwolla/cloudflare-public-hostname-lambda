stages:
  enableCD: true
  build:
    # nvm-sbt rather than sbt: the Scala.js test suite runs on node.
    nodeLabel: nvm-sbt
    steps:
      # Jenkins' durable shell is /bin/sh; sdkman-init.sh uses `source`, so run under bash.
      - |
        exec bash <<'JENKINS_BUILD'
        set +o xtrace
        . "${NVM_DIR}/nvm.sh" --no-use
        nvm install
        export SDKMAN_DIR="$HOME/.sdkman"
        mkdir -p "${SDKMAN_DIR}/candidates/java/current/bin"
        source "${SDKMAN_DIR}/bin/sdkman-init.sh"
        sdk env install use
        set -o xtrace
        sbt test
        sbt doc
        sbt npmPackage
        JENKINS_BUILD
    filesToStash:
      - '**'
  deployProd:
    nodeLabel: nvm-sbt-deployer
    steps:
      - |
        ./deploy.sh
        
